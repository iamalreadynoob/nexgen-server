services:
  api:
    image: nexgensemantics/nexgen:latest
    container_name: nexgen-server
    env_file:
      - .env
    environment:
      # Overrides MONGODB_URI from .env so the API talks to the compose service.
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  mongo:
    image: mongo:7
    container_name: nexgen-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-nexgen}
    volumes:
      - nexgen_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

volumes:
  nexgen_mongo_data:

networks:
  backend: