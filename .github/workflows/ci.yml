name: CI

on:
  push:
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

  # One job per suite, so each one shows up as its own check on the push/PR.
  # New test modules must be added to the `paths` of a suite (or a new suite).
  test:
    name: Test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: actuators
            paths: tests/unit/api/v1/test_actuators.py
          - suite: data
            paths: tests/unit/api/v1/test_data.py
          - suite: contents
            paths: tests/unit/api/v1/test_contents.py
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: >-
          uv run pytest ${{ matrix.paths }}
          --cov --cov-report=term-missing --junitxml=junit.xml

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.suite }}
          path: junit.xml
